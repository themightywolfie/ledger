# Predicate pack: software delivery. A policy starts from it with `extends: [software-delivery]`,
# and any predicate the policy declares itself replaces the pack's declaration of it.
version: 1
predicates:
  deployed_version:
    cardinality: single
    value_type: version
    freshness: volatile
  test_status:
    cardinality: single
    value_type: { enum: [passing, failing] }
    freshness: volatile
    system_of_record: test_run
    verifier: { use: test_run }
    agent_claims: require_evidence
  pr_state:
    cardinality: single
    value_type: { enum: [draft, open, merged, closed] }
    freshness: volatile
    system_of_record: github
    verifier: { use: github, params: { check: pr_state } }
  ci_status:
    cardinality: single
    value_type: { enum: [pending, passing, failing] }
    freshness: volatile
    system_of_record: github
    verifier: { use: github, params: { check: ci_status } }
    agent_claims: require_evidence
  # A repository subject, and the name of a branch it has.
  branch_exists:
    cardinality: multi
    value_type: text
    freshness: volatile
    system_of_record: git
    verifier: { use: git, params: { check: branch_exists } }
  migration_status:
    cardinality: single
    value_type: { enum: [pending, applied, rolled_back] }
    freshness: volatile
  owner:
    cardinality: single
    value_type: subject
    freshness: slow
  uses_dependency:
    cardinality: multi
    value_type: text
    freshness: slow
  decision:
    cardinality: multi
    value_type: text
    freshness: stable
