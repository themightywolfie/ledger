<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger visualizer prototype</title>
<!--
  PROTOTYPE — throwaway. Three structurally different layouts for the memory visualizer,
  switchable with ?variant=A|B|C or the floating bar (← → keys).
  Question it answers: how should an operator see a claim's trust, evidence and history,
  and work the review queue? Fake data, stub actions, no tests. Do not ship this file.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Palette: white + violet from themightywolfie.github.io (src/index.css); dark mode uses neutral system greys. */
:root {
  --paper: #F5F5F7; --sheet: #FFFFFF; --ink: #1D1D1F; --ink-2: #515154; --ink-3: #6E6E73;
  --rule: #E5E5EA; --rule-2: #F0F0F3; --hover: #F2F2F5;
  --accent: #7C3AED; --accent-strong: #6D28D9; --accent-soft: #F3EEFE; --accent-fill: #7C3AED; --on-accent: #FFFFFF;
  --selection: #DDD0FD; --ledger: #1A7F4B;
  --s-proposed: #9A6700; --s-verified: #1A7F4B; --s-contested: #1D63C9; --s-superseded: #6E6E73;
  --s-retracted: #C4261D; --s-quarantined: #B5306F; --focus: #7C3AED;
  --font-ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-said: "Source Serif 4", Georgia, serif;
  --font-seen: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --lift: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 16px rgba(16, 24, 40, 0.03);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1C1C1E; --sheet: #2C2C2E; --ink: #F5F5F7; --ink-2: #C7C7CC; --ink-3: #98989D;
    --rule: #3A3A3C; --rule-2: #333336; --hover: #343437;
    --accent: #A78BFA; --accent-strong: #C4B5FD; --accent-soft: #3A3350; --accent-fill: #7C3AED; --on-accent: #FFFFFF;
    --selection: #4C3D7A; --ledger: #3FB950;
    --s-proposed: #E3B341; --s-verified: #3FB950; --s-contested: #58A6FF; --s-superseded: #98989D;
    --s-retracted: #F47067; --s-quarantined: #E275AD; --focus: #A78BFA;
    --lift: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1C1C1E; --sheet: #2C2C2E; --ink: #F5F5F7; --ink-2: #C7C7CC; --ink-3: #98989D;
  --rule: #3A3A3C; --rule-2: #333336; --hover: #343437;
  --accent: #A78BFA; --accent-strong: #C4B5FD; --accent-soft: #3A3350; --accent-fill: #7C3AED; --on-accent: #FFFFFF;
  --selection: #4C3D7A; --ledger: #3FB950;
  --s-proposed: #E3B341; --s-verified: #3FB950; --s-contested: #58A6FF; --s-superseded: #98989D;
  --s-retracted: #F47067; --s-quarantined: #E275AD; --focus: #A78BFA;
  --lift: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
}
::selection { background: var(--selection); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
p { margin: 0; }
.mono { font-family: var(--font-seen); font-size: 0.86em; }
.muted { color: var(--ink-3); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shared header ---------- */
.app-head { display: flex; align-items: center; gap: 20px; padding: 10px 20px; border-bottom: 1px solid var(--rule); background: var(--sheet); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.wordmark { font: 600 21px/1 var(--font-said); letter-spacing: 0.01em; text-decoration: none; color: var(--ink); padding-bottom: 3px; border-bottom: 3px double var(--accent); }
.where { color: var(--ink-3); font-size: 13px; }
.where b { color: var(--ink-2); font-weight: 500; }
.head-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.head-nav a { color: var(--ink-2); text-decoration: none; padding: 6px 10px; border-radius: var(--r-sm); font-size: 14px; }
.head-nav a[aria-current="page"] { color: var(--accent-strong); background: var(--accent-soft); font-weight: 500; }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--accent-fill); color: var(--on-accent); font-size: 12px; text-align: center; line-height: 18px; }
.theme-btn { border: 1px solid var(--rule); background: transparent; border-radius: var(--r-sm); padding: 5px 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; }

/* ---------- status vocabulary ---------- */
.badge { --c: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--c); background: color-mix(in srgb, var(--c) 11%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); white-space: nowrap; }
.badge .i { font-size: 12px; width: 12px; text-align: center; }
.s-proposed { --c: var(--s-proposed); } .s-verified { --c: var(--s-verified); } .s-contested { --c: var(--s-contested); }
.s-superseded { --c: var(--s-superseded); } .s-retracted { --c: var(--s-retracted); } .s-quarantined { --c: var(--s-quarantined); }
.mark { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.mark.trusted { color: var(--ledger); font-weight: 500; }
.mark.stale { color: var(--s-proposed); }
.marks { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }

/* ---------- said / seen voices ---------- */
.said { font-family: var(--font-said); font-size: 23px; line-height: 1.35; font-weight: 400; margin: 0; }
.said::before { content: "\201C"; } .said::after { content: "\201D"; }
.said.small { font-size: 17px; }
.seen { font-family: var(--font-seen); font-size: 12.5px; line-height: 1.5; color: var(--ink-2); background: var(--rule-2); border-radius: var(--r-sm); padding: 6px 8px; overflow-wrap: anywhere; }

/* ---------- trust receipt: the one bold element ---------- */
.receipt { width: 100%; max-width: 440px; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.receipt th { text-align: left; font-weight: 400; padding: 4px 12px 4px 0; white-space: nowrap; }
.receipt td { padding: 4px 0; }
.receipt .why { color: var(--ink-3); font-size: 13px; padding-right: 12px; }
.receipt .n { text-align: right; font-family: var(--font-seen); font-size: 13.5px; white-space: nowrap; }
.receipt .sub th, .receipt .sub td { border-top: 1px solid var(--rule); }
.receipt .total th { font-weight: 700; padding-top: 8px; }
.receipt .total td { padding-top: 8px; }
.receipt .total .n { font-weight: 500; font-size: 15px; border-top: 1px solid var(--ink); border-bottom: 3px double var(--accent); padding: 6px 0 3px 10px; }
.explain { font-size: 15px; color: var(--ink); max-width: 60ch; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-md); padding: 6px 12px; font-size: 14px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); border-color: var(--accent-fill); }
.btn.primary:hover { opacity: 0.9; }
.btn.danger { color: var(--s-retracted); border-color: color-mix(in srgb, var(--s-retracted) 40%, transparent); }
.btn kbd { font-family: var(--font-seen); font-size: 11px; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-left: 6px; opacity: 0.7; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- evidence / rail / journal ---------- */
.evidence { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.evidence li { display: grid; grid-template-columns: 92px 1fr; gap: 4px 12px; align-items: start; }
.outcome { font-size: 13px; font-weight: 500; }
.outcome.pass { color: var(--s-verified); } .outcome.fail { color: var(--s-retracted); } .outcome.inconclusive, .outcome.pending { color: var(--s-proposed); }
.ev-meta { font-size: 13px; color: var(--ink-3); }
.rail { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--rule); display: grid; gap: 12px; }
.rail li { position: relative; }
.rail li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--ink-3); }
.rail li.now::before { background: var(--ledger); border-color: var(--ledger); }
.rail a { color: inherit; text-decoration: none; }
.rail a:hover .rail-val { text-decoration: underline; }
.rail-val { font-family: var(--font-said); font-size: 16px; }
.journal { width: 100%; border-collapse: collapse; font-size: 13px; }
.journal th, .journal td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
.journal th { font-weight: 500; color: var(--ink-3); }
.journal .seq { font-variant-numeric: tabular-nums; color: var(--ink-3); }

/* ---------- toast ---------- */
.toast { position: fixed; right: 20px; bottom: 76px; max-width: min(460px, calc(100vw - 32px)); background: var(--ink); color: var(--sheet); padding: 12px 14px; border-radius: var(--r-md); font-size: 14px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast pre { margin: 8px 0 0; font-family: var(--font-seen); font-size: 12px; white-space: pre-wrap; opacity: 0.85; }

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #FFD60A; color: #000; border-radius: 999px; padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 50; font: 500 13px/1 system-ui, sans-serif; }
.proto-bar button { border: 0; background: #000; color: #FFD60A; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
.proto-bar span { padding: 0 12px; white-space: nowrap; }

/* =========================================================
   Variant A — Explorer: three panes
   ========================================================= */
.va { display: grid; grid-template-columns: 220px minmax(280px, 360px) minmax(0, 1fr); height: calc(100vh - 53px); }
.va-side { border-right: 1px solid var(--rule); padding: 18px 16px; overflow: auto; background: var(--sheet); }
.va-side h2 { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 18px 0 8px; }
.va-side h2:first-child { margin-top: 0; }
.scope-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.scope-list button { width: 100%; display: flex; justify-content: space-between; border: 0; background: transparent; padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; text-align: left; font-size: 14px; color: var(--ink-2); }
.scope-list button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 500; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; color: var(--ink-2); }
.va-list { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.va-search { padding: 14px; border-bottom: 1px solid var(--rule); }
.va-search input { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--sheet); }
.va-rows { overflow: auto; flex: 1; }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule-2); background: transparent; padding: 12px 14px; cursor: pointer; }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row-top { display: flex; justify-content: space-between; gap: 8px; }
.row-subj { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.row-pred { color: var(--ink-3); font-size: 13px; }
.row-val { font-family: var(--font-said); font-size: 16px; margin: 4px 0 6px; }
.row .trust-n { font-family: var(--font-seen); font-size: 13px; color: var(--ink-2); }
.va-detail { overflow: auto; padding: 28px 36px 120px; }
.va-detail article { max-width: 760px; display: grid; gap: 26px; }
.keyline { color: var(--ink-3); font-size: 14px; }
.keyline b { color: var(--ink); font-weight: 700; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; font-size: 14px; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; }
.va-detail section { display: grid; gap: 12px; }
.va-detail h3 { font-size: 15px; font-weight: 700; }
.shadow-note { border-left: 3px solid var(--s-superseded); padding: 6px 12px; font-size: 14px; color: var(--ink-2); }
.back { display: none; }

/* =========================================================
   Variant B — Chronicle: timeline first
   ========================================================= */
.vb { padding: 18px 20px 0; }
.vb-controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }
.ctl-label { font-size: 13px; color: var(--ink-3); margin-right: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-left: auto; }
.vb-chart { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-lg); overflow-x: auto; box-shadow: var(--lift); }
.vb-chart svg { display: block; }
.vb-chart text { font-family: var(--font-ui); fill: var(--ink); }
.lane-subj { font-size: 12px; fill: var(--ink-3) !important; }
.lane-pred { font-size: 14px; font-weight: 700; }
.tick { font-size: 11.5px; fill: var(--ink-3) !important; }
.bar { cursor: pointer; }
.bar:focus-visible { outline: none; }
.bar:focus-visible rect, .bar:hover rect { stroke: var(--ink); stroke-width: 2; }
.bar-label { font-family: var(--font-said) !important; font-size: 13.5px; pointer-events: none; }
.vb-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 52vh; overflow: auto; background: var(--sheet); border-top: 1px solid var(--rule); box-shadow: 0 -10px 30px rgba(0,0,0,.12); padding: 20px 24px 80px; z-index: 20; }
.vb-sheet-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 32px; max-width: 1400px; }
.vb-sheet h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.close { position: absolute; right: 18px; top: 14px; }
.vb-spacer { height: 56vh; }

/* =========================================================
   Variant C — Desk: review queue first
   ========================================================= */
.vc { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 53px); }
.vc-queue { border-right: 1px solid var(--rule); background: var(--sheet); padding: 18px 0; }
.vc-queue h2 { font-size: 17px; padding: 0 18px; }
.vc-queue .sub { padding: 2px 18px 14px; font-size: 13px; color: var(--ink-3); }
.q-group { margin-top: 10px; }
.q-group h3 { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px 18px; display: flex; justify-content: space-between; }
.q-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 18px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.q-item:hover { background: var(--hover); }
.q-item[aria-current="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); font-weight: 500; }
.q-item.done { text-decoration: line-through; color: var(--ink-3); }
.vc-main { padding: 22px 40px 120px; }
.vc-find { display: flex; gap: 10px; align-items: center; margin-bottom: 28px; max-width: 980px; }
.vc-find input { flex: 1; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--sheet); }
.find-results { max-width: 980px; margin: -18px 0 24px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-md); }
.find-results button { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule-2); background: transparent; padding: 10px 12px; cursor: pointer; align-items: center; }
.vc-item { max-width: 980px; display: grid; gap: 22px; }
.vc-q { font: 600 30px/1.2 var(--font-said); }
.vc-why { color: var(--ink-2); max-width: 70ch; }
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; align-content: start; box-shadow: var(--lift); }
.sheet { container-type: inline-size; }
@container (max-width: 440px) { .receipt .why { display: none; } }
.sheet .who { font-size: 13.5px; color: var(--ink-2); }
.sheet .pick { justify-self: start; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.rules li { display: grid; grid-template-columns: 22px 210px 1fr; gap: 8px; }
.rules .r-no { color: var(--ink-3); }
.reason { display: grid; gap: 6px; max-width: 520px; font-size: 14px; }
.reason input { padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--sheet); }
.vc-done { padding: 40px 0; }

/* ---------- narrow screens ---------- */
@media (max-width: 960px) {
  .va { grid-template-columns: 1fr; height: auto; }
  .va-side { border-right: 0; border-bottom: 1px solid var(--rule); }
  .va-list { border-right: 0; }
  .va-rows { max-height: none; }
  .va.detail-open .va-side, .va.detail-open .va-list { display: none; }
  .va:not(.detail-open) .va-detail { display: none; }
  .va-detail { padding: 18px 16px 120px; }
  .back { display: inline-block; margin-bottom: 14px; }
  .vb { padding: 14px 16px 0; }
  .vb-sheet-grid { grid-template-columns: 1fr; gap: 20px; }
  .vc { grid-template-columns: 1fr; }
  .vc-queue { border-right: 0; border-bottom: 1px solid var(--rule); }
  .vc-main { padding: 18px 16px 120px; }
  .duel { grid-template-columns: 1fr; }
  .rules li { grid-template-columns: 22px 1fr; }
  .rules li span:last-child { grid-column: 2; }
  .app-head { padding: 10px 16px; gap: 10px 16px; }
  .head-nav { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>
</head>

function drawChart(host) {
  const W = Math.max(760, host.clientWidth), LABEL = 210, RIGHT = 128, plotW = W - LABEL - RIGHT;
  // Focus + context: outside the 7-day view, the last week gets 60% of the width so today's activity is legible.
  const start = new Date(+NOW - RANGES[B.range]), end = new Date(+NOW + (B.range === '7d' ? 0.4 * D : 0.6 * D));
  const focus = B.range === '7d' ? null : new Date(+NOW - 7 * D);
  const frac = t => {
    const v = Math.max(+start, Math.min(+end, +t));
    if (!focus) return (v - start) / (end - start);
    return v < focus ? 0.4 * (v - start) / (focus - start) : 0.4 + 0.6 * (v - focus) / (end - focus);
  };
  const x = t => LABEL + frac(t) * plotW;
  const PAD = RIGHT;
  const ROWH = 30, LANEPAD = 14;
  let y = 44, body = '';
  const span = c => {
    if (B.axis === 'valid') return [T(c.valid_from), c.valid_to ? T(c.valid_to) : NOW];
    const chain = chainOf(c), i = chain.indexOf(c), next = chain[i + 1];
    return [T(c.recorded_at), next ? T(next.recorded_at) : NOW];
  };
  for (const lane of LANES) {
    const rows = lane.rows || 1, h = rows * ROWH + LANEPAD;
    body += `<line x1="0" x2="${W}" y1="${y - 8}" y2="${y - 8}" stroke="var(--rule-2)"/>`;
    body += `<text x="16" y="${y + 10}" class="lane-subj">${esc(lane.subj)}</text><text x="16" y="${y + 27}" class="lane-pred">${esc(lane.pred)}</text>`;
    lane.ids.forEach((id, i) => {
      const c = byId(id), [s0, s1] = span(c), row = rows > 1 ? i : 0, by = y + row * ROWH + 2, bh = ROWH - 8;
      const x0 = x(s0), x1 = Math.max(x(s1), x0 + 6), color = `var(--s-${c.status})`, clipped = s0 < start;
      let shape;
      if (c.status === 'retracted') {
        shape = `<rect x="${x0 - 9}" y="${by}" width="18" height="${bh}" rx="4" fill="var(--sheet)" stroke="${color}"/><text x="${x0}" y="${by + bh / 2 + 5}" text-anchor="middle" style="fill:${color};font-size:13px">✕</text>`;

      } else {
        const sf = B.axis === 'valid' && c.status === 'verified' ? staleFrom(c) : null;
        if (sf && sf < NOW && x(sf) > x0) {
          const xs = Math.min(x(sf), x1);
          shape = `<rect x="${x0}" y="${by}" width="${xs - x0}" height="${bh}" rx="4" fill="${color}" opacity="${c.status === 'superseded' ? 0.45 : 0.9}"/><rect x="${xs}" y="${by + 3}" width="${Math.max(0, x1 - xs)}" height="${bh - 6}" rx="3" fill="none" stroke="${color}" stroke-dasharray="2 3"/>`;
        } else {

      else if (x1 + 6 + need <= W - PAD) lx = x1 + 6;
      else { lx = x0 - (c.status === 'retracted' ? 14 : 6); anchor = 'end'; }
      body += `<g class="bar" tabindex="0" role="button" data-bar="${c.id}" aria-label="${esc(lane.pred + ': ' + c.value + ', ' + STATUS[c.status].label)}">${shape}
        <text x="${lx}" y="${by + bh / 2 + 5}" text-anchor="${anchor}" class="bar-label" style="fill:${fill}">${esc(label)}</text>
        ${clipped ? `<text x="${LABEL + 2}" y="${by - 2}" class="tick">since ${fmtDay(c.valid_from)}</text>` : ''}
        ${c.conflict && i === 0 ? `<text x="${W - PAD + 14}" y="${by + ROWH}" style="fill:var(--s-contested);font-size:13px">⇄ Conflict</text>` : ''}
        ${c.question ? `<text x="${W - PAD + 14}" y="${by + bh / 2 + 5}" style="fill:var(--s-proposed);font-size:13px">? Question open</text>` : ''}

  host.querySelectorAll('[data-bar]').forEach(g => {

}

    </aside>
    <section class="vc-main">
      <div class="vc-find"><label class="visually-hidden" for="qc">Find a claim</label><input id="qc" type="search" placeholder="Find a claim by subject, predicate or text" value="${esc(Cv.find)}"></div>
      ${results.length ? `<div class="find-results">${results.map(c => `<button data-stub="GET /v1/claims/${c.id}"><span style="min-width:160px"><b>${esc(c.subject)}</b><br><span class="muted">${esc(c.predicate)}</span></span><span style="font-family:var(--font-said);flex:1">${esc(c.value)}</span>${badge(c.status)}</button>`).join('')}</div>` : ''}
      ${Cv.done.size === QUEUE.length ? `<div class="vc-done"><p class="vc-q">Nothing needs you right now.</p><p class="vc-why" style="margin-top:10px">New conflicts, questions and quarantined claims will appear here as agents write.</p></div>` : renderItem(item)}
    </section>
  </main>`;
  bindTheme();
  root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { Cv.cur = +b.dataset.i; renderC(root); });
  root.querySelectorAll('[data-decide]').forEach(b => b.onclick = () => decideC(b.dataset.decide, b.dataset.call));
  const q = root.querySelector('#qc'); q.oninput = () => { Cv.find = q.value; const pos = q.selectionStart; renderC(root); const n = root.querySelector('#qc'); n.focus(); n.setSelectionRange(pos, pos); };
}
function decideC(label, call) {
  toast(`${label}. Prototype: this would call the REST API.`, call);
  Cv.done.add(QUEUE[Cv.cur].key);
  const next = QUEUE.findIndex((q, i) => i > Cv.cur && !Cv.done.has(q.key));
  Cv.cur = next >= 0 ? next : Math.max(0, QUEUE.findIndex(q => !Cv.done.has(q.key)));
  renderC(document.getElementById('app'));
}
function decideBtn(label, call, key, cls = '') { return `<button class="btn ${cls}" data-decide="${esc(label)}" data-call="${esc(call)}">${esc(label)}${key ? `<kbd>${key}</kbd>` : ''}</button>`; }
function sheetC(c, pickLabel, pickKey, pickCall) {
  return `<div class="sheet">
    <blockquote class="said small">${esc(c.text)}</blockquote>
    ${marks(c)}
    <p class="who">${sourceLine(c)}, ${ago(c.recorded_at)}</p>
    ${receipt(c)}
    <div><h4 style="font-size:14px;margin-bottom:8px">Evidence</h4>${evidenceList(c)}</div>
    ${pickLabel ? `<span class="pick">${decideBtn(pickLabel, pickCall, pickKey, 'primary')}</span>` : ''}
  </div>`;
}
function renderItem(q) {
  if (q.conflict) {
    const f = CONFLICTS.find(x => x.id === q.conflict), [a, b] = f.claims.map(byId);
    return `<div class="vc-item">
      <h1 class="vc-q">${esc(q.title)}</h1>
      <p class="vc-why">Two claims in project billing-api disagree, and no rule could decide between them. Agents get both, marked as contested, until you choose.</p>
      <div class="duel">${sheetC(a, 'Choose ' + a.value, '1', `POST /v1/resolve {"conflict_set":"${f.id}","winner":"${a.id}"}`)}${sheetC(b, 'Choose ' + b.value, '2', `POST /v1/resolve {"conflict_set":"${f.id}","winner":"${b.id}"}`)}</div>
      <div><h3 style="font-size:15px;margin-bottom:10px">Rules Ledger tried</h3>
        <ul class="rules">${f.rules.map(r => `<li><span class="r-no" aria-hidden="true">✕</span><span>${r[1]}</span><span class="muted">${r[2]}</span></li>`).join('')}</ul>
        <p class="vc-why" style="margin-top:10px">${esc(f.reverify)}</p></div>
      <label class="reason">Reason for your choice (kept in the journal)<input placeholder="For example: per the service catalogue review on 24 Oct"></label>
      <div class="actions">${decideBtn('Skip for now', 'no call', 'S')}</div>
    </div>`;
  }
  const c = byId(q.claim);
  const intro = {
    'Questions': 'A sub-agent reported this, and the policy asks a person to confirm migrations. Agents see it as unverified until you answer.',
    'Quarantined': c.quarantine_reason,
    'Stale': explain(c),
    'Unverified': explain(c),
  }[q.group];
  const buttons = {
    'Questions': decideBtn('Yes, it is applied', `POST /v1/questions/${c.question}/answer {"answer":"confirm"}`, '1', 'primary') + decideBtn('No, it is not', `POST /v1/questions/${c.question}/answer {"answer":"reject"}`, '2') + decideBtn('Skip for now', 'no call', 'S'),
    'Quarantined': decideBtn('Keep quarantined', 'no call', '1', 'primary') + decideBtn('Release as my statement', `POST /v1/claims/${c.id}/release`, '2') + decideBtn('Forget it', `POST /v1/forget {"claim_ids":["${c.id}"]}`, '3', 'danger'),
    'Stale': decideBtn('Re-verify now', `POST /v1/claims/${c.id}/reverify`, '1', 'primary') + decideBtn('Skip for now', 'no call', 'S'),
    'Unverified': decideBtn('Re-verify now', `POST /v1/claims/${c.id}/reverify`, '1', 'primary') + decideBtn('Confirm it myself', `POST /v1/attest {"claim_id":"${c.id}","evidence":[{"kind":"human_confirmation"}]}`, '2') + decideBtn('Retract', `POST /v1/resolve {"retract":"${c.id}"}`, '3') ,
  }[q.group];
  return `<div class="vc-item">
    <h1 class="vc-q">${esc(q.title)}</h1>
    <p class="vc-why">${esc(intro)}</p>
    <div class="duel" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">${sheetC(c)}
      <div class="sheet"><h4 style="font-size:14px">How this fact changed</h4>${historyRail(c)}<h4 style="font-size:14px;margin-top:8px">Journal entries</h4>${journalRows(c)}</div></div>
    <div class="actions">${buttons}</div>
  </div>`;
}
document.addEventListener('keydown', e => {
  if (current() !== 'C' || e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'j' || e.key === 'k') { Cv.cur = (Cv.cur + (e.key === 'j' ? 1 : QUEUE.length - 1)) % QUEUE.length; renderC(document.getElementById('app')); }
  const btns = [...document.querySelectorAll('.vc-item [data-decide]')];
  const hit = btns.find(b => b.querySelector('kbd')?.textContent.toLowerCase() === e.key.toLowerCase());
  if (hit) hit.click();
});

/* ============================================================
   Prototype switcher (not part of any variant)
   ============================================================ */
const VARIANTS = { A: { meta: A, render: renderA }, B: { meta: B, render: renderB }, C: { meta: Cv, render: renderC } };
const KEYS = Object.keys(VARIANTS);
function current() { const v = new URLSearchParams(location.search).get('variant'); return KEYS.includes(v) ? v : 'A'; }
function go(v) { const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); render(); }
function render() {
  const v = current(), root = document.getElementById('app');
  VARIANTS[v].render(root);
  document.querySelector('.proto-bar')?.remove();
  const bar = document.createElement('div'); bar.className = 'proto-bar'; bar.setAttribute('role', 'toolbar'); bar.setAttribute('aria-label', 'Prototype variant switcher');
  bar.innerHTML = `<button aria-label="Previous variant">←</button><span>${v} (${VARIANTS[v].meta.name})</span><button aria-label="Next variant">→</button>`;
  const [prev, , next] = bar.children;
  const i = KEYS.indexOf(v);
  prev.onclick = () => go(KEYS[(i + KEYS.length - 1) % KEYS.length]);
  next.onclick = () => go(KEYS[(i + 1) % KEYS.length]);
  document.body.appendChild(bar);
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  const i = KEYS.indexOf(current());
  if (e.key === 'ArrowLeft') go(KEYS[(i + KEYS.length - 1) % KEYS.length]);
  if (e.key === 'ArrowRight') go(KEYS[(i + 1) % KEYS.length]);
});
let resizeTimer; addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (current() === 'B') render(); }, 150); });
render();
</script>
</body>
