[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/themightywolfie/ledger"

[workspace.dependencies]
ledgermem-core = { path = "crates/ledgermem-core" }
ledgermem-sqlite = { path = "crates/ledgermem-sqlite" }
ledgermem-server = { path = "crates/ledgermem-server" }

clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
rmcp = { version = "3.7", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ulid = "3.0"
